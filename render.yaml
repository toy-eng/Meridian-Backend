# Render Blueprint spec: https://render.com/docs/blueprint-spec
#
# Import with: Render Dashboard -> New -> Blueprint -> pick this repo.
# It creates the web service only. The database is external (Neon), so
# DATABASE_URL is prompted for during the import.
#
# The region is `ohio` (AWS us-east-2) to sit alongside the Neon project.
# Change it if your database lives somewhere else.

services:
  - type: web
    name: staffsync-api
    runtime: node
    region: ohio
    branch: main
    autoDeploy: true
    plan: free # free instances spin down after ~15 min idle (cold starts)
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # External Postgres (Neon). Paste the full connection string, including
      # the ?sslmode=require suffix, when the import asks for it.
      - key: DATABASE_URL
        sync: false
      # Generate a fresh value - the database is new, so there are no existing
      # sessions to preserve and no reason to reuse the old secret.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set this to your frontend origin(s), e.g. https://app.example.com
      # Leave blank to fall back to "*" (any origin).
      - key: CORS_ORIGIN
        sync: false
      # Email. BREVO_API_KEY is the one that matters on Render: outbound SMTP
      # ports (25/465/587) are blocked here, so the mailer sends over Brevo's
      # HTTPS API on 443 instead. Brevo -> SMTP & API -> API Keys (xkeysib-...).
      - key: BREVO_API_KEY
        sync: false
      # The SMTP values are a local-development fallback only; they cannot
      # connect from Render. Copy them from .env if you want them.
      - key: BREVO_SMTP_HOST
        sync: false
      - key: BREVO_SMTP_PORT
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASS
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
