# Render Blueprint spec: https://render.com/docs/blueprint-spec
#
# Import with: Render Dashboard -> New -> Blueprint -> pick this repo.
# It creates the Postgres database *and* the web service in one go.
#
# Keep the database and the web service in the SAME region so they talk over
# Render's private network (no egress cost, no public exposure).

databases:
  - name: staffsync-db
    databaseName: staffsync
    user: staffsync
    region: oregon
    plan: basic-256mb # change to `free` if your account still has free Postgres access

services:
  - type: web
    name: staffsync-api
    runtime: node
    region: oregon
    branch: main
    autoDeploy: true
    plan: free # free instances spin down after ~15 min idle (cold starts)
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Injected automatically from the database defined above (internal URL).
      - key: DATABASE_URL
        fromDatabase:
          name: staffsync-db
          property: connectionString
      # Paste the same JWT_SECRET your existing deployment used so current
      # login tokens stay valid.
      # A new random value is fine too, but it logs every user out.
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      # Set this to your frontend origin(s), e.g. https://app.example.com
      # Leave blank to fall back to "*" (any origin).
      - key: CORS_ORIGIN
        sync: false
      # The BREVO_* names are historical - these two only configure SMTP
      # (this project sends through Gmail today). Copy them from .env.
      - key: BREVO_SMTP_HOST
        sync: false
      - key: BREVO_SMTP_PORT
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASS
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
